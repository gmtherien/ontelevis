org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Off: with the configuration cache, KSP sometimes generated nothing for a module (no error), and
# Hilt then failed at runtime with "Cannot create an instance of ...ViewModel".
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP2 incremental mode sometimes generated nothing when only a dependency module changed
# (Hilt then lost ViewModels: "Cannot create an instance of ...ViewModel"). Full runs are cheap here.
ksp.incremental=false
